name: Deploy 9router to Bonto

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 9router
        uses: actions/checkout@v4

      - name: Check Bonto credentials
        env:
          BONTO_USERNAME: ${{ secrets.BONTO_USERNAME }}
          BONTO_PASSWORD: ${{ secrets.BONTO_PASSWORD }}
        run: |
          echo "BONTO_USERNAME length: ${#BONTO_USERNAME}"
          echo "BONTO_PASSWORD length: ${#BONTO_PASSWORD}"

          if [ -z "$BONTO_USERNAME" ]; then
            echo "BONTO_USERNAME is empty"
            exit 1
          fi

          if [ -z "$BONTO_PASSWORD" ]; then
            echo "BONTO_PASSWORD is empty"
            exit 1
          fi

          cat > askpass.sh <<'EOF'
          #!/bin/sh
          case "$1" in
            *sername*) echo "$BONTO_USERNAME" ;;
            *assword*) echo "$BONTO_PASSWORD" ;;
          esac
          EOF

          chmod +x askpass.sh

          GIT_ASKPASS="$PWD/askpass.sh" GIT_TERMINAL_PROMPT=0 git ls-remote https://api.bonto.dev/git/cpa-kavera.git

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies for build
        run: npm install --include=dev --include=optional

      - name: Build Next.js standalone
        run: npm run build

      - name: Prepare Bonto deploy folder
        run: |
          rm -rf bonto-deploy
          mkdir -p bonto-deploy

          cp -a .next/standalone/. bonto-deploy/

          rm -rf bonto-deploy/node_modules

          cp -r public bonto-deploy/public

          mkdir -p bonto-deploy/.next
          cp -r .next/static bonto-deploy/.next/static

          cp package.json bonto-deploy/package.json

          if [ -f package-lock.json ]; then
            cp package-lock.json bonto-deploy/package-lock.json
          fi

          mkdir -p bonto-deploy/data
          touch bonto-deploy/data/.gitkeep

          cat > bonto-deploy/.gitignore <<'EOF'
          node_modules/
          npm-debug.log*
          .env
          EOF

          cat > bonto-deploy/.npmrc <<'EOF'
          optional=true
          fund=false
          audit=false
          EOF

      - name: Add Bonto entrypoint
        run: |
          cat > bonto-deploy/index.js <<'EOF'
          process.env.NODE_ENV = process.env.NODE_ENV || "production";
          process.env.HOSTNAME = process.env.HOSTNAME || "0.0.0.0";
          process.env.PORT = process.env.PORT || "3000";
          process.env.DATA_DIR = process.env.DATA_DIR || "./data";
          process.env.NEXT_TELEMETRY_DISABLED = "1";

          require("./server.js");
          EOF

      - name: Patch package.json for Bonto runtime
        run: |
          cd bonto-deploy
          node - <<'EOF'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));

          pkg.scripts = pkg.scripts || {};
          pkg.scripts.start = "node index.js";

          pkg.main = "index.js";
          pkg.engines = {
            node: "22.x"
          };

          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          EOF

      - name: Verify deploy folder
        run: |
          ls -lah bonto-deploy
          test -f bonto-deploy/server.js
          test -f bonto-deploy/index.js
          test -f bonto-deploy/package.json
          test ! -d bonto-deploy/node_modules
          du -sh bonto-deploy
          echo "package.json start script:"
          node -e "const p=require('./bonto-deploy/package.json'); console.log(p.scripts.start)"

      - name: Push to Bonto Git remote
        env:
          BONTO_USERNAME: ${{ secrets.BONTO_USERNAME }}
          BONTO_PASSWORD: ${{ secrets.BONTO_PASSWORD }}
        run: |
          cd bonto-deploy

          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "Deploy 9router to Bonto"

          cat > askpass.sh <<'EOF'
          #!/bin/sh
          case "$1" in
            *sername*) echo "$BONTO_USERNAME" ;;
            *assword*) echo "$BONTO_PASSWORD" ;;
          esac
          EOF

          chmod +x askpass.sh

          GIT_ASKPASS="$PWD/askpass.sh" GIT_TERMINAL_PROMPT=0 git push --force https://api.bonto.dev/git/cpa-kavera.git HEAD:master
