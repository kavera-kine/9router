name: Deploy 9router to Bonto

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout 9router
        uses: actions/checkout@v4

      - name: Check Bonto credentials
        env:
          BONTO_USERNAME: ${{ secrets.BONTO_USERNAME }}
          BONTO_PASSWORD: ${{ secrets.BONTO_PASSWORD }}
        run: |
          echo "BONTO_USERNAME length: ${#BONTO_USERNAME}"
          echo "BONTO_PASSWORD length: ${#BONTO_PASSWORD}"

          if [ -z "$BONTO_USERNAME" ]; then
            echo "BONTO_USERNAME is empty"
            exit 1
          fi

          if [ -z "$BONTO_PASSWORD" ]; then
            echo "BONTO_PASSWORD is empty"
            exit 1
          fi

          cat > askpass.sh <<'EOF'
          #!/bin/sh
          case "$1" in
            *sername*) echo "$BONTO_USERNAME" ;;
            *assword*) echo "$BONTO_PASSWORD" ;;
          esac
          EOF

          chmod +x askpass.sh
          GIT_ASKPASS="$PWD/askpass.sh" GIT_TERMINAL_PROMPT=0 git ls-remote https://api.bonto.dev/git/cpa-kavera.git

      - name: Setup QEMU for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build standalone in linux arm64 container
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/work \
            -w /work \
            node:22-alpine \
            sh -lc '
              apk add --no-cache python3 make g++ git tar gzip

              rm -rf node_modules .next bonto-deploy

              npm install --include=dev --include=optional --no-audit --no-fund
              npm run build

              mkdir -p bonto-deploy

              cp -a .next/standalone/. bonto-deploy/
              cp -r public bonto-deploy/public

              mkdir -p bonto-deploy/.next
              cp -r .next/static bonto-deploy/.next/static

              mkdir -p bonto-deploy/data
              touch bonto-deploy/data/.gitkeep

              tar -czf bonto-deploy/node_modules.tar.gz -C .next/standalone node_modules
              rm -rf bonto-deploy/node_modules

              cat > bonto-deploy/index.js <<'"'"'EOF'"'"'
              const fs = require("fs");
              const childProcess = require("child_process");

              function ensureNodeModules() {
                try {
                  require.resolve("next/package.json");
                  return;
                } catch (_) {
                  console.log("[startup] node_modules not found; extracting node_modules.tar.gz...");
                }

                if (!fs.existsSync("node_modules.tar.gz")) {
                  throw new Error("node_modules.tar.gz not found");
                }

                childProcess.execFileSync("rm", ["-rf", "node_modules"], { stdio: "inherit" });
                childProcess.execFileSync("tar", ["-xzf", "node_modules.tar.gz"], { stdio: "inherit" });
              }

              ensureNodeModules();

              process.env.NODE_ENV = process.env.NODE_ENV || "production";
              process.env.HOSTNAME = process.env.HOSTNAME || "0.0.0.0";
              process.env.PORT = process.env.PORT || "3000";
              process.env.DATA_DIR = process.env.DATA_DIR || "./data";
              process.env.NEXT_TELEMETRY_DISABLED = "1";

              require("./server.js");
              EOF

              cat > bonto-deploy/package.json <<'"'"'EOF'"'"'
              {
                "name": "9router-bonto",
                "version": "0.4.6",
                "private": true,
                "main": "index.js",
                "scripts": {
                  "start": "node index.js"
                },
                "dependencies": {}
              }
              EOF

              cat > bonto-deploy/.gitignore <<'"'"'EOF'"'"'
              node_modules/
              npm-debug.log*
              .env
              EOF

              ls -lah bonto-deploy
              du -sh bonto-deploy
              test -f bonto-deploy/server.js
              test -f bonto-deploy/index.js
              test -f bonto-deploy/package.json
              test -f bonto-deploy/node_modules.tar.gz
            '

      - name: Verify deploy folder
        run: |
          ls -lah bonto-deploy
          du -sh bonto-deploy
          test -f bonto-deploy/server.js
          test -f bonto-deploy/index.js
          test -f bonto-deploy/package.json
          test -f bonto-deploy/node_modules.tar.gz
          test ! -d bonto-deploy/node_modules

      - name: Push to Bonto Git remote
        env:
          BONTO_USERNAME: ${{ secrets.BONTO_USERNAME }}
          BONTO_PASSWORD: ${{ secrets.BONTO_PASSWORD }}
        run: |
          cd bonto-deploy

          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "Deploy 9router bundled to Bonto"

          cat > askpass.sh <<'EOF'
          #!/bin/sh
          case "$1" in
            *sername*) echo "$BONTO_USERNAME" ;;
            *assword*) echo "$BONTO_PASSWORD" ;;
          esac
          EOF

          chmod +x askpass.sh
          GIT_ASKPASS="$PWD/askpass.sh" GIT_TERMINAL_PROMPT=0 git push --force https://api.bonto.dev/git/cpa-kavera.git HEAD:master
